<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f1" />
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('quizblitz-theme')==='dark'?'dark':'light';document.querySelector('meta[name="theme-color"]').content=document.documentElement.dataset.theme==='dark'?'#201f2b':'#faf8f1'}catch{document.documentElement.dataset.theme='light'}</script>
    <meta name="description" content="QuizBlitz — fast, live multiplayer quizzes." />
    <title>QuizBlitz</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
