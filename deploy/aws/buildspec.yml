version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm ci
  build:
    commands:
      - ': "${VITE_API_URL:?Set VITE_API_URL in the CodeBuild project}"'
      - ': "${SITE_BUCKET:?Set SITE_BUCKET in the CodeBuild project}"'
      - npm --workspace client run build
  post_build:
    commands:
      - aws s3 sync client/dist "s3://${SITE_BUCKET}" --delete
      - |
        if [ -n "${CLOUDFRONT_DISTRIBUTION_ID:-}" ]; then
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/" "/index.html"
        fi

